apiVersion: v1
data:
  clustercontrol-controllers.json: |
    {
      "uid": "kuber-cc-clustercontrol-controllers",
      "title": "ClusterControl Controllers",
      "description": "ClusterControl controller and importer health: resource reconcile outcomes, AppBundle status, and import sweep coverage.",
      "tags": [
        "clustercontrol",
        "kuber-cc"
      ],
      "schemaVersion": 39,
      "editable": true,
      "graphTooltip": 1,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timezone": "browser",
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "label": "Data source",
            "query": "prometheus",
            "current": {},
            "hide": 0,
            "refresh": 1
          },
          {
            "name": "kubernetes_cluster",
            "type": "query",
            "label": "Kubernetes cluster",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "query": {
              "qryType": 1,
              "query": "label_values(kubernetes_cluster)",
              "refId": "PrometheusVariableQuery"
            },
            "refresh": 2,
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "sort": 1
          }
        ]
      },
      "annotations": {
        "list": []
      },
      "links": [
        {
          "type": "dashboards",
          "title": "ClusterControl dashboards",
          "tags": [
            "clustercontrol"
          ],
          "asDropdown": true,
          "includeVars": true,
          "keepTime": true,
          "icon": "external link",
          "targetBlank": false,
          "url": ""
        }
      ],
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "DatabaseOperator status (active = 1)",
          "description": "Status of the installed database operator stack.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "fillOpacity": 8,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "kuber_dboperators_status{kubernetes_cluster=~\"$kubernetes_cluster\"}",
              "legendFormat": "{{status}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "AppBundle conditions (status = True)",
          "description": "Which AppBundle condition types currently hold True.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "fillOpacity": 8,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "kuber_appbundles_condition_status{status=\"True\",kubernetes_cluster=~\"$kubernetes_cluster\"}",
              "legendFormat": "{{condition_type}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Reconcile rate by resource",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "custom": {
                "fillOpacity": 8,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(kuber_dbclusters_reconcile_total{kubernetes_cluster=~\"$kubernetes_cluster\"}[5m]))",
              "legendFormat": "DatabaseCluster",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "refId": "B",
              "expr": "sum(rate(kuber_dbbackups_reconcile_total{kubernetes_cluster=~\"$kubernetes_cluster\"}[5m]))",
              "legendFormat": "DatabaseBackup",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "refId": "C",
              "expr": "sum(rate(kuber_dbbackupschedules_reconcile_total{kubernetes_cluster=~\"$kubernetes_cluster\"}[5m]))",
              "legendFormat": "DatabaseBackupSchedule",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "refId": "D",
              "expr": "sum(rate(kuber_dboperators_reconcile_total{kubernetes_cluster=~\"$kubernetes_cluster\"}[5m]))",
              "legendFormat": "DatabaseOperator",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "refId": "E",
              "expr": "sum(rate(kuber_appbundles_reconcile_total{kubernetes_cluster=~\"$kubernetes_cluster\"}[5m]))",
              "legendFormat": "AppBundle",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "refId": "F",
              "expr": "sum(rate(kuber_clusterchangerequests_reconcile_total{kubernetes_cluster=~\"$kubernetes_cluster\"}[5m]))",
              "legendFormat": "ClusterChangeRequest",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Reconcile errors by resource",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "custom": {
                "fillOpacity": 8,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(kuber_dbclusters_reconcile_total{result=\"error\",kubernetes_cluster=~\"$kubernetes_cluster\"}[5m]))",
              "legendFormat": "DatabaseCluster",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "refId": "B",
              "expr": "sum(rate(kuber_dbbackups_reconcile_total{result=\"error\",kubernetes_cluster=~\"$kubernetes_cluster\"}[5m]))",
              "legendFormat": "DatabaseBackup",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "refId": "C",
              "expr": "sum(rate(kuber_dbbackupschedules_reconcile_total{result=\"error\",kubernetes_cluster=~\"$kubernetes_cluster\"}[5m]))",
              "legendFormat": "DatabaseBackupSchedule",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "refId": "D",
              "expr": "sum(rate(kuber_dboperators_reconcile_total{result=\"error\",kubernetes_cluster=~\"$kubernetes_cluster\"}[5m]))",
              "legendFormat": "DatabaseOperator",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "refId": "E",
              "expr": "sum(rate(kuber_appbundles_reconcile_total{result=\"error\",kubernetes_cluster=~\"$kubernetes_cluster\"}[5m]))",
              "legendFormat": "AppBundle",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "refId": "F",
              "expr": "sum(rate(kuber_clusterchangerequests_reconcile_total{result=\"error\",kubernetes_cluster=~\"$kubernetes_cluster\"}[5m]))",
              "legendFormat": "ClusterChangeRequest",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Reconcile duration p95 by resource",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 16
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "fillOpacity": 8,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(kuber_dbclusters_reconcile_duration_seconds_bucket{kubernetes_cluster=~\"$kubernetes_cluster\"}[5m])))",
              "legendFormat": "DatabaseCluster",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "refId": "B",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(kuber_dbbackups_reconcile_duration_seconds_bucket{kubernetes_cluster=~\"$kubernetes_cluster\"}[5m])))",
              "legendFormat": "DatabaseBackup",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "refId": "C",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(kuber_dbbackupschedules_reconcile_duration_seconds_bucket{kubernetes_cluster=~\"$kubernetes_cluster\"}[5m])))",
              "legendFormat": "DatabaseBackupSchedule",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "refId": "D",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(kuber_dboperators_reconcile_duration_seconds_bucket{kubernetes_cluster=~\"$kubernetes_cluster\"}[5m])))",
              "legendFormat": "DatabaseOperator",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "refId": "E",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(kuber_appbundles_reconcile_duration_seconds_bucket{kubernetes_cluster=~\"$kubernetes_cluster\"}[5m])))",
              "legendFormat": "AppBundle",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "refId": "F",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(kuber_clusterchangerequests_reconcile_duration_seconds_bucket{kubernetes_cluster=~\"$kubernetes_cluster\"}[5m])))",
              "legendFormat": "ClusterChangeRequest",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Requeues / not-found by resource",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 16
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "custom": {
                "fillOpacity": 8,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (result) (rate(kuber_dbclusters_reconcile_total{result=~\"requeue|not_found\",kubernetes_cluster=~\"$kubernetes_cluster\"}[5m]))",
              "legendFormat": "DatabaseCluster {{result}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "refId": "B",
              "expr": "sum by (result) (rate(kuber_dbbackups_reconcile_total{result=~\"requeue|not_found\",kubernetes_cluster=~\"$kubernetes_cluster\"}[5m]))",
              "legendFormat": "DatabaseBackup {{result}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "refId": "C",
              "expr": "sum by (result) (rate(kuber_dbbackupschedules_reconcile_total{result=~\"requeue|not_found\",kubernetes_cluster=~\"$kubernetes_cluster\"}[5m]))",
              "legendFormat": "DatabaseBackupSchedule {{result}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "refId": "D",
              "expr": "sum by (result) (rate(kuber_dboperators_reconcile_total{result=~\"requeue|not_found\",kubernetes_cluster=~\"$kubernetes_cluster\"}[5m]))",
              "legendFormat": "DatabaseOperator {{result}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "refId": "E",
              "expr": "sum by (result) (rate(kuber_appbundles_reconcile_total{result=~\"requeue|not_found\",kubernetes_cluster=~\"$kubernetes_cluster\"}[5m]))",
              "legendFormat": "AppBundle {{result}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "refId": "F",
              "expr": "sum by (result) (rate(kuber_clusterchangerequests_reconcile_total{result=~\"requeue|not_found\",kubernetes_cluster=~\"$kubernetes_cluster\"}[5m]))",
              "legendFormat": "ClusterChangeRequest {{result}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "AppBundle import sweeps",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 24
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "custom": {
                "fillOpacity": 8,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (result) (rate(kuber_appbundleimports_runs_total{kubernetes_cluster=~\"$kubernetes_cluster\"}[15m]))",
              "legendFormat": "{{result}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Resources discovered per sweep (p95)",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 24
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "fillOpacity": 8,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(kuber_appbundleimports_discovered_bucket{kubernetes_cluster=~\"$kubernetes_cluster\"}[1h])))",
              "legendFormat": "p95",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ]
        }
      ]
    }
kind: ConfigMap
