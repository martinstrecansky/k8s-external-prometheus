kind: ConfigMap
metadata:
  annotations:
    gitops.severalnines.com/cleanup-with-parent: AppBundle/severalnines-system/prometheus-stack
    gitops.severalnines.com/parent: AppBundle/severalnines-system/prometheus-stack
    grafana_folder: ClusterControl Internal
  labels:
    grafana_dashboard: "1"
    observability.kuber-cc/audience: internal
    observability.kuber-cc/feature: dashboards
  name: kuber-dashboard-platform-scrape
  namespace: observability
---
apiVersion: v1
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: ClusterControl
        type: prometheus
        access: proxy
        url: "https://143.198.135.53:9090"
        basicAuth: true
        basicAuthUser: $__file{/etc/secrets/cmon-prom-auth/username}
        secureJsonData:
          basicAuthPassword: $__file{/etc/secrets/cmon-prom-auth/password}
        jsonData:
          tlsSkipVerify: true
          httpMethod: POST
        isDefault: true
        editable: false
kind: ConfigMap
metadata:
  annotations:
    gitops.severalnines.com/cleanup-with-parent: AppBundle/severalnines-system/prometheus-stack
    gitops.severalnines.com/parent: AppBundle/severalnines-system/prometheus-stack
  labels:
    grafana_datasource: "1"
    observability.kuber-cc/feature: external-datasource
  name: kuber-datasource-clustercontrol
  namespace: observability
---
apiVersion: v1
data:
  keys: admin-user,admin-password
  owner: prometheus-stack
  secretName: prometheus-stack-grafana-admin
kind: ConfigMap
metadata:
  annotations:
    gitops.severalnines.com/cleanup-with-parent: AppBundle/severalnines-system/prometheus-stack
    gitops.severalnines.com/parent: AppBundle/severalnines-system/prometheus-stack
  labels:
    agent.severalnines.com/expose-registry: "true"
  name: expose-prometheus-stack-grafana-admin
  namespace: observability
---
apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    gitops.severalnines.com/cleanup-with-parent: AppBundle/severalnines-system/prometheus-stack
    gitops.severalnines.com/parent: AppBundle/severalnines-system/prometheus-stack
  labels:
    severalnines.com/feature: prometheus-stack
    severalnines.com/role: grafana-admin-init
  name: prometheus-stack-grafana-admin-init
  namespace: severalnines-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  annotations:
    gitops.severalnines.com/cleanup-with-parent: AppBundle/severalnines-system/prometheus-stack
    gitops.severalnines.com/parent: AppBundle/severalnines-system/prometheus-stack
  name: prometheus-stack-grafana-admin-init
  namespace: observability
rules:
- apiGroups:
  - ""
  resourceNames:
  - prometheus-stack-grafana-admin
  resources:
  - secrets
  verbs:
  - get
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  annotations:
    gitops.severalnines.com/cleanup-with-parent: AppBundle/severalnines-system/prometheus-stack
    gitops.severalnines.com/parent: AppBundle/severalnines-system/prometheus-stack
  name: prometheus-stack-grafana-admin-init
  namespace: observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus-stack-grafana-admin-init
subjects:
- kind: ServiceAccount
  name: prometheus-stack-grafana-admin-init
  namespace: severalnines-system
---
apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    gitops.severalnines.com/cleanup-with-parent: AppBundle/severalnines-system/prometheus-stack
    gitops.severalnines.com/parent: AppBundle/severalnines-system/prometheus-stack
  labels:
    severalnines.com/feature: prometheus-stack
    severalnines.com/role: grafana-admin-init
  name: prometheus-stack-grafana-admin-init
  namespace: severalnines-system
spec:
  activeDeadlineSeconds: 300
  backoffLimit: 4
  completions: 1
  parallelism: 1
  template:
    metadata:
      labels:
        severalnines.com/feature: prometheus-stack
        severalnines.com/role: grafana-admin-init
    spec:
      containers:
      - args:
        - |
          set -eu

          # Check-before-write: an existing admin Secret is NEVER
          # touched — re-runs (Argo replay, addon re-reconcile, agent
          # restart) must not rotate the live Grafana admin password.
          if kubectl get secret -n "$GRAFANA_NAMESPACE" "$SECRET_NAME" >/dev/null 2>&1; then
            echo "$SECRET_NAME already present; nothing to do"
            exit 0
          fi

          umask 077
          PASSWORD=$(tr -dc 'A-Za-z0-9' </dev/urandom | head -c 32)

          # create-only: if a concurrent run won the race this fails,
          # the pod retries, and the check above exits 0.
          kubectl create secret generic "$SECRET_NAME" \
            --namespace "$GRAFANA_NAMESPACE" \
            --from-literal=admin-user=admin \
            --from-literal=admin-password="$PASSWORD"
          echo "$SECRET_NAME created"
        command:
        - /bin/sh
        - -c
        env:
        - name: GRAFANA_NAMESPACE
          value: observability
        - name: SECRET_NAME
          value: prometheus-stack-grafana-admin
        image: alpine/k8s:1.31.5
        name: grafana-admin-init
      restartPolicy: OnFailure
      serviceAccountName: prometheus-stack-grafana-admin-init

