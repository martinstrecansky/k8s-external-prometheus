apiVersion: agent.severalnines.com/v1alpha1
kind: AppBundle
metadata:
  labels:
    appbundle.severalnines.com/managed: "true"
    appbundle.severalnines.com/owner: default.moco-helm
    appbundle.severalnines.com/shared: "true"
  name: cert-manager
  namespace: severalnines-system
spec:
  interval: 1m
  manageLifecycle: true
  provider: argo
  prune: true
  source:
    helm:
      chart: cert-manager
      repoURL: https://charts.jetstack.io
      values:
        crds:
          enabled: true
      version: '>=1.15.0 <2.0.0'
    kind: helm
  sync:
    createNamespace: true
  targetNamespace: cert-manager
