apiVersion: agent.severalnines.com/v1alpha1
kind: AppBundle
metadata:
  labels:
    severalnines.com/feature: prometheus-stack
  name: prometheus-stack
  namespace: severalnines-system
spec:
  manageLifecycle: true
  provider: argo
  prune: true
  source:
    helm:
      chart: kube-prometheus-stack
      repoURL: https://prometheus-community.github.io/helm-charts
      values: |
        crds:
          enabled: true
        prometheusOperator:
          enabled: true
        defaultRules:
          create: false
        alertmanager:
          enabled: false
        grafana:
          enabled: true
          # Admin credentials come from the addon-delivered Secret created
          # once by the grafana-admin init Job (see admin_secret.go /
          # grafana-admin-init.yaml). Without existingSecret the subchart
          # renders a fresh randAlphaNum password on every `helm template`
          # (Argo has no cluster `lookup`), keeping the Application
          # permanently OutOfSync and rotating the password on every sync
          # (CLUS-7411). The keys match the exposure-registry entry the UI
          # credentials modal reads (expose.go).
          admin:
            existingSecret: prometheus-stack-grafana-admin
            userKey: admin-user
            passwordKey: admin-password
          # Mounts the prometheus-agent remote-write auth Secret into the
          # Grafana pod when the external-Prometheus datasource ships — the
          # provisioned datasource (datasource.go) reads the credentials via
          # Grafana's $__file{} provider. Substituted to [] when inactive.
          extraSecretMounts: [{"name": "cmon-prom-auth", "secretName": "cmon-prom-auth", "mountPath": "/etc/secrets/cmon-prom-auth", "readOnly": true}]
          service:
            type: NodePort
            nodePort: 32080
          sidecar:
            datasources:
              enabled: true
              label: grafana_datasource
              # The addon intentionally disables the bundled Prometheus server
              # by default. Without this guard, kube-prometheus-stack
              # provisions a `prometheus` datasource pointing at a Service that
              # does not exist.
              defaultDatasourceEnabled: false
            # Discovers the ClusterControl dashboard ConfigMaps the addon
            # ships as auxiliaries (see dashboards.go). folderAnnotation +
            # foldersFromFilesStructure place each dashboard in the Grafana
            # folder named by its `grafana_folder` annotation.
            dashboards:
              enabled: true
              label: grafana_dashboard
              labelValue: "1"
              folderAnnotation: grafana_folder
              provider:
                foldersFromFilesStructure: true
        prometheus:
          enabled: false
          service:
            type: ClusterIP
          prometheusSpec:
            podMonitorSelectorNilUsesHelmValues: false
            serviceMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            probeSelectorNilUsesHelmValues: false
            enableRemoteWriteReceiver: true
            retention: 24h
        nodeExporter:
          enabled: false
        kubeStateMetrics:
          enabled: false
        # Kube-* scrape jobs need their target services; disabling all of them
        # in operator-only mode avoids the chart attempting to wire scrapes to
        # components that may not exist in every cluster shape.
        kubeApiServer:
          enabled: false
        kubelet:
          enabled: false
        kubeControllerManager:
          enabled: false
        coreDns:
          enabled: false
        kubeDns:
          enabled: false
        kubeEtcd:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeProxy:
          enabled: false
      version: 75.6.0
    kind: helm
  sync:
    createNamespace: true
    prunePropagationPolicy: foreground
    serverSideApply: true
  targetNamespace: observability
