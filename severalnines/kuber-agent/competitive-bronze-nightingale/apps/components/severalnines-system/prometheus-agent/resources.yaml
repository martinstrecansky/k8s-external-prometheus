kind: ClusterRole
metadata:
  annotations:
    gitops.severalnines.com/cleanup-with-parent: AppBundle/severalnines-system/prometheus-agent
    gitops.severalnines.com/parent: AppBundle/severalnines-system/prometheus-agent
  labels:
    severalnines.com/feature: prometheus-agent
  name: prometheus-agent
rules:
- apiGroups:
  - ""
  resources:
  - nodes
  - nodes/metrics
  - services
  - endpoints
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
- apiGroups:
  - networking.k8s.io
  resources:
  - ingresses
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - discovery.k8s.io
  resources:
