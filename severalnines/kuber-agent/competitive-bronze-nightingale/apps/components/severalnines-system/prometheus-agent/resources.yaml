    gitops.severalnines.com/cleanup-with-parent: AppBundle/severalnines-system/prometheus-agent
    gitops.severalnines.com/parent: AppBundle/severalnines-system/prometheus-agent
  labels:
    severalnines.com/feature: prometheus-agent
  name: prometheus-agent
  namespace: observability
---
