apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  labels:
    appbundle.severalnines.com/managed: "true"
    appbundle.severalnines.com/owner-nn: severalnines-system.prometheus-agent
  name: prometheus-agent
  namespace: argocd
spec:
  destination:
    name: ""
    namespace: observability
    server: https://kubernetes.default.svc
  project: default
  source:
    directory: {}
    path: severalnines/kuber-agent/competitive-bronze-nightingale/apps/components/severalnines-system/prometheus-agent
    repoURL: https://github.com/martinstrecansky/k8s-external-prometheus
    targetRevision: main
  syncPolicy:
    automated:
      allowEmpty: false
      prune: false
      selfHeal: false
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true

